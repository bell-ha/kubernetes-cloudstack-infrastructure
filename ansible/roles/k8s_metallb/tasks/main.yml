---
- name: Install MetalLB
  shell: |
    kubectl apply --validate=false -f https://raw.githubusercontent.com/metallb/metallb/v0.14.5/config/manifests/metallb-native.yaml
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf

- name: Wait for controller
  shell: |
    kubectl wait --namespace metallb-system --for=condition=available --timeout=180s deployment/controller
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf

- name: Create IPAddressPool
  copy:
    dest: /tmp/metallb-ip-pool.yaml
    content: |
      apiVersion: metallb.io/v1beta1
      kind: IPAddressPool
      metadata:
        name: default-pool
        namespace: metallb-system
      spec:
        addresses:
          - 192.168.50.100-192.168.50.200

- name: Apply pool
  shell: kubectl apply -f /tmp/metallb-ip-pool.yaml
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf

- name: Create L2Advertisement
  copy:
    dest: /tmp/metallb-l2adv.yaml
    content: |
      apiVersion: metallb.io/v1beta1
      kind: L2Advertisement
      metadata:
        name: default
        namespace: metallb-system
      spec:
        ipAddressPools:
          - default-pool

- name: Apply L2Advertisement
  shell: kubectl apply -f /tmp/metallb-l2adv.yaml
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
